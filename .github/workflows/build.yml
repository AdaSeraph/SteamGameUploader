name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0, 7))" }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Build and package
        shell: pwsh
        run: ./Build-Release.ps1 -Package -Version '${{ steps.version.outputs.value }}'

      - uses: actions/upload-artifact@v7
        with:
          name: SteamGameUploader-${{ steps.version.outputs.value }}-win-x64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  # Pushing a v* tag publishes a GitHub release. The annotated tag message becomes the release notes.
  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # A shallow tag checkout can drop the annotated tag object, so fetch it explicitly.
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          git tag -l --format='%(contents)' "$TAG" > notes.md
          args=(--title "Steam Game Uploader $TAG" --verify-tag)
          if [ -s notes.md ]; then args+=(--notes-file notes.md); else args+=(--generate-notes); fi
          if [[ "$TAG" == *-* ]]; then args+=(--prerelease); fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* "${args[@]}"
          fi
